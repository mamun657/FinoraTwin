name: finora_twin
description: "FinoraTwin — AI financial copilot for small businesses."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.6.2

  http: ^1.2.2
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.2
  drift: ^2.20.3
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  sqlite3: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.0

  intl: ^0.20.2

  fl_chart: ^0.69.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  flutter_markdown: ^0.7.5

  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.20.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

dependency_overrides:
  analyzer_plugin: ^0.13.0

flutter:
  uses-material-design: true

  assets:
    - images/login2.png
    - images/signup.jpg
    - assets/icons/transaction.png
    - assets/icons/simulation.png
    - assets/icons/ai-robot.png
    - assets/icons/apps.png
    - assets/icons/activity.png

